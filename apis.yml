  - type: Features
    data:
      - name: Consult
        description: Returns a direct, evidence-grounded answer to a clinical question with inline
          citations and organized context.
      - name: Differential Diagnosis
        description: Generates a structured, ranked differential diagnosis with case discussion and
          recommended diagnostic next steps from a patient one-liner or chief complaint.
      - name: Assessment and Plan
        description: Drafts clinical-grade assessment-and-plan documentation with synthesized
          impressions and evidence-linked recommendations.
      - name: Chart Summarization
        description: AI synthesis of EHR data across notes, labs, imaging, and medications into a
          clinician-ready summary.
      - name: Ambient Scribing
        description: Real-time diagnostic insights during the patient encounter plus automatic
          generation of comprehensive clinical documentation afterward.
      - name: Clinical Documentation
        description: Generates History and Physical notes, progress notes with interval changes and
          vital signs, discharge summaries with disposition planning, and patient-facing discharge
          instructions in plain language.
      - name: Deep Reasoning
        description: Enhanced reasoning mode for complex, high-stakes, or ambiguous clinical
          questions.
      - name: Workspace
        description: Unified dashboard with file tabs, inline editing, and version history across
          clinical artifacts.
      - name: Mobile Apps
        description: Native iOS and Android Glass Health applications for clinicians on the go.
  - type: UseCases
    data:
      - name: Triage and Differential Diagnosis
        description: Generating ranked differentials at the point of triage or initial workup to
          surface diagnoses worth considering.
      - name: Treatment Planning
        description: Producing evidence-linked treatment options and assessment-and-plan drafts for
          clinician review.
      - name: Clinical Question Answering
        description: Answering bedside clinical questions with citations to current medical
          literature.
      - name: Patient Record Summarization
        description: Synthesizing longitudinal EHR data into a coherent patient summary.
      - name: Ambient Documentation
        description: Capturing patient-clinician encounters in real time and producing structured
          notes without manual scribing.
      - name: Patient Education
        description: Generating plain-language discharge instructions and condition-specific
          handouts.
      - name: Medical Education
        description: Supporting medical students, residents, and fellows in case-based clinical
          reasoning practice.
  - type: TargetUsers
    data:
      - name: Physicians
        description: Attending physicians across primary care and specialties.
      - name: Advanced Practice Providers
        description: Nurse practitioners and physician assistants.
      - name: Residents and Fellows
        description: Trainees using Glass for case-based reasoning and documentation support.
      - name: Medical Students
        description: Students learning differential diagnosis and clinical decision making.
      - name: Healthcare Developers
        description: Third-party healthcare product teams building on the Glass Developer API.
  - type: Plans
    data:
      - name: Lite
        description: Free tier with limited ambient scribing and limited clinical decision support;
          no credit card required.
      - name: Starter
        description: $20/month tier for individual clinicians beginning to integrate Glass into
          their workflow.
      - name: Pro
        description: $90/month tier expanding ambient scribing and clinical decision support for
          regular use.
      - name: Max
        description: $200/month tier for higher-volume practices needing the full Glass capability
          set.
      - name: Developer API
        description: $250/month minimum with token-metered usage beyond the floor, providing
          programmatic access to the Glass clinical AI agent.
      - name: Enterprise
        description: Custom enterprise plans for health systems and organizations; contact
          enterprise@glass.health.
  - type: DeveloperAPI
    data:
      - name: REST Interface
        description: RESTful HTTP interface with secure authentication and structured endpoints for
          clinical queries.
      - name: Consult Endpoint
        description: Returns evidence-grounded answers to clinical questions with inline citations
          and metadata.
      - name: Differential Diagnosis Endpoint
        description: Returns ranked differentials and recommended next steps from clinical inputs.
      - name: Assessment and Plan Endpoint
        description: Returns drafted assessment-and-plan documentation grounded in clinical
          evidence.
      - name: Scribing Endpoint
        description: Generates diarized transcripts and structured clinical documentation from
          encounter audio in a single API call.
      - name: Streaming Progress
        description: Real-time progress updates from the agent during processing, suitable for
          display to end users.
      - name: Markdown Responses
        description: Responses are returned in markdown with in-text citations and metadata for
          source rendering.
      - name: Self-Serve Activation
        description: Developer API keys can be provisioned self-serve from the Glass web app.
  - type: Integrations
    data:
      - name: SMART On FHIR
        description: Glass integrates directly into EHR workflows via SMART on FHIR, surfacing the
          clinical AI inside the EHR interface.
      - name: EHR Data Elements
        description: Pulls demographics, past medical history, problem lists, medications, surgical
          history, laboratory values, vital signs, imaging studies, functional status, social
          history, allergies, preventive care, and encounter data.
      - name: iOS
        description: Native Glass Health app on the Apple App Store.
      - name: Android
        description: Native Glass Health app on Google Play.
  - type: Compliance
    data:
      - name: HIPAA
        description: HIPAA-compliant handling of protected health information for clinical decision
          support and ambient documentation workflows.
      - name: Safety Disclaimer
        description: Glass publishes a clinical safety disclaimer outlining that outputs are
          decision support and require clinician judgment.
  - type: Company
    data:
      - name: Founded
