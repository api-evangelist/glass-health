aid: glass-health
name: Glass Health
description: >-
  Glass Health is a San Francisco-based clinical AI company founded in 2021 by
  Dereck Paul (CEO) and Graham Ramsey (Head of Product) that builds an AI
  clinical decision support (CDS) and ambient scribing co-pilot for physicians,
  nurse practitioners, physician assistants, residents, and medical students.
  The Glass platform combines large language model reasoning with curated,
  physician-reviewed clinical guidelines to generate ranked differential
  diagnoses, evidence-based assessment and plans, chart summaries, and direct
  answers to clinical questions ("Consult"), all delivered with inline
  citations. Glass also provides ambient scribing that listens during patient
  encounters and generates History and Physical notes, progress notes,
  discharge summaries, and patient-facing instructions, plus EHR integration
  via SMART on FHIR to pull demographics, problem lists, medications,
  laboratory values, vital signs, imaging, and encounter data into the
  workflow. Glass offers a tiered SaaS plan (Lite free tier, Starter at
  $20/month, Pro at $90/month, Max at $200/month) along with iOS and Android
  apps, and a public Glass Developer API ($250/month minimum, token-metered
  beyond the floor) that exposes the same clinical AI agent — Consult,
  Differential Diagnosis, Assessment and Plan, and Scribing endpoints — for
  third-party healthcare products. Glass is backed by Breyer Capital and
  graduated from Y Combinator's W23 batch, with roughly $6.5M in total
  disclosed funding. The provider does not publish an open OpenAPI
  specification or open-source SDKs; integration details are gated behind the
  developer portal and an enterprise contact at enterprise@glass.health.
